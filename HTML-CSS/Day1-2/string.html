<!-- String -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Instruments</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-img-container {
       height: 200px;           /* same height for all cards */
       display: flex;           
       align-items: center;     /* center vertically */
       justify-content: center; /* center horizontally */
       overflow: hidden;
     }
     .card-img-container img {
       max-height: 100%;
       width: auto;             /* keep aspect ratio */
       object-fit: contain;     /* prevents cropping */
      }
    
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center">String Instruments</h2>
    <div class="row justify-content-center g-4">
      
      <!-- Violin Card -->
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-img-container">
            <img src="../images/violin.jpeg" class="card-img-top" alt="Violin">
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Violin</h5>
            <p class="card-text small">
              A classical string instrument played with a bow.
            </p>
            <a href="#" class="btn btn-primary mt-auto">View Price</a>
          </div>
        </div>
      </div>

      <!-- Guitar Card -->
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-img-container">
            <img src="../images/guitar.jpeg" class="card-img-top" alt="Guitar">
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Guitar</h5>
            <p class="card-text small">
              A versatile string instrument played by strumming or plucking.
            </p>
            <a href="#" class="btn btn-primary mt-auto">View Price</a>
          </div>
        </div>
      </div>

      <!-- Veena Card -->
      <div class="col-sm-6 col-lg-3">
        <div class="card h-100 shadow-sm text-center">
          <div class="card-img-container">
            <img src="../images/veena.jpeg" class="card-img-top" alt="Veena">
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Veena</h5>
            <p class="card-text small">
              Traditional Indian string instrument with a resonant sound.
            </p>
            <a href="#" class="btn btn-primary mt-auto">View Price</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
