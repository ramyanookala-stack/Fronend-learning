<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Musical Concert</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body {
      background-image: url('../images/beginner.webp');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      text-align: center;
      background-color: #B7832F;
      color: black;
      padding: 15px 0;
    }

    main {
      flex: 1;
    }

    .contact-card {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .contact-info i {
      margin-right: 10px;
      color: #B7832F;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Contact Us</h1>
    <i class="bi bi-envelope"></i>
  </header>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 contact-card">

        <!-- Contact Form -->
        <h3 class="mb-4 text-center">Send us a Message</h3>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your Name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="Your Email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Your Message"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send Message</button>
        </form>

        <!-- Contact Details -->
        <div class="contact-info mt-5">
          <h5>Our Contact Details</h5>
          <p><i class="bi bi-telephone-fill"></i> +91 98765 43210</p>
          <p><i class="bi bi-envelope-fill"></i> info@musicalconcert.com</p>
          <p><i class="bi bi-geo-alt-fill"></i> 123 Music Street, Chennai, India</p>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 Ramya | Portfolio
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
