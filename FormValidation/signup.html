<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="../FormValidation/signup.js"></script>
  <style>
    body {
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      text-align: center;
      background-color: #B7832F;
      color: black;
      padding: 15px 0;
    }

    main {
      flex: 1;
    }

    .contact-card {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .contact-info i {
      margin-right: 10px;
      color: #B7832F;
    }
  </style>
</head>
<body>



<main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 contact-card">


          <form id="custom-form">

             <div class="mb-3">
                <label for="firstName" class="form-label">FirstName:</label>
                <input type="text" class="form-control" name="firstName" id="firstName" placeholder="firstName"/>
            </div>
            <div id="firstName_error"></div>
            <br>
             <div class="mb-3">
                <label for="lastName" class="form-label">LastName:</label>
                <input type="text" class="form-control" name="lastName" id="lastName" placeholder="lastName"/>
             </div>
             <div id="lastName_error"></div>
            <br>
             <div class="mb-3">
                 <label for="email" class="form-label">Email:</label>
                 <input type="email" class="form-control"  name="email" id="email" placeholder="email"/>
             </div>
             <div id="email_error"></div>
             <br>
             <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="email" class="form-control" name="Password" id="password" placeholder="password" />
             </div>
             <div id="password_error"></div>
            <br>
            <div class="mb-3">
               <label class="form-label">Gender:</label>
                <select class="form-select" aria-label="Default select example" name="gender" id="gender">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>

            </div>
            <br>
             <button type="submit" class="btn btn-primary w-100" onClick="validateForm()">submit</button>

             <button type="submit" class="btn btn-primary w-100" onClick="reset()">reset</button>

             <br>
        </form>
      
      </div>
</div>
</body>
</main>
